version: 2

models:
  - name: stg_alerts
    description: "Cleaned and validated clinical alerts."

    columns:
      - name: alert_id
        description: "Unique identifier of the alert."
        data_tests:
          - not_null
          - unique

      - name: patient_id
        description: "Identifier of the patient associated with the alert."


      - name: priority
        description: "Alert priority."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - LOW
                  - MEDIUM
                  - HIGH